# Databáze projektu Hlídač vážení. Spuštění: docker compose up -d --wait
services:
  db:
    image: postgres:16-alpine
    container_name: hlidac-db
    shm_size: 1gb   # paralelní dotazy PostgreSQL potřebují víc sdílené paměti
    environment:
      POSTGRES_DB: hlidac
      POSTGRES_USER: hlidac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hlidac}
      TZ: Europe/Prague
    command:
      - postgres
      - -c
      - timezone=Europe/Prague
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hlidac-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlidac -d hlidac"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  hlidac-data:
