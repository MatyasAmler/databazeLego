[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hlidac-vazeni"
version = "1.0.0"
description = "Hlídač vážení - sledování kontrolních vah na balicích linkách (simulace)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Matyáš Amler" }]
dependencies = ["psycopg[binary]>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hlidac = "hlidac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: test potřebuje běžící databázi (docker compose up)",
    "slow: dlouhý test nad celým simulovaným obdobím (HLIDAC_FULL=1)",
]
